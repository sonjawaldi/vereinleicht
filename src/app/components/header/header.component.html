<header class="site-header">
  <div class="site-header__bar">
    <a
      routerLink="/"
      fragment="home"
      (click)="closeMenus('home')"
      class="site-logo"
      aria-label="vereinleicht Startseite"
    >
      <img class="site-logo__light" src="vereinleicht-logo.svg" alt="" width="1280" height="260" />
      <img
        class="site-logo__dark"
        src="vereinleicht-logo-dark.svg"
        alt=""
        width="1280"
        height="260"
      />
    </a>

    <nav class="site-nav" aria-label="Hauptnavigation">
      @for (item of navItems; track item.fragment) {
        <a routerLink="/" [fragment]="item.fragment" (click)="closeMenus(item.fragment)">{{
          item.label
        }}</a>
      }
    </nav>

    <div class="site-actions">
      <button
        type="button"
        (click)="themeService.toggleDarkMode()"
        class="site-theme"
        aria-label="Farbschema wechseln"
      >
        <svg class="site-theme__moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path>
        </svg>
        <svg class="site-theme__sun" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"
          ></path>
        </svg>
      </button>
      <a
        routerLink="/"
        fragment="contact"
        (click)="closeMenus('contact')"
        class="vl-btn vl-btn--primary site-cta"
        >Meldet euch</a
      >
      <button
        type="button"
        (click)="toggleMenu()"
        class="site-menu"
        aria-label="Navigation öffnen oder schließen"
        [attr.aria-expanded]="isMenuOpen"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (isMenuOpen) {
            <path d="M6 6l12 12M18 6L6 18"></path>
          } @else {
            <path d="M4 7h16M4 12h16M4 17h10"></path>
          }
        </svg>
      </button>
    </div>
  </div>

  @if (isMenuOpen) {
    <nav class="site-mobile-nav" aria-label="Mobile Hauptnavigation">
      @for (item of navItems; track item.fragment) {
        <a routerLink="/" [fragment]="item.fragment" (click)="closeMenus(item.fragment)">{{
          item.label
        }}</a>
      }
      <a
        routerLink="/"
        fragment="contact"
        (click)="closeMenus('contact')"
        class="vl-btn vl-btn--primary"
        >Meldet euch</a
      >
    </nav>
  }
</header>
