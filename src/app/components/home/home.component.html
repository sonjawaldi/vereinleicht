<div class="min-h-screen bg-vl-canvas">
  <app-header area="verein" />
  <main id="main-content" tabindex="-1">
    <app-home-hero />
    <app-home-offer
      (appointmentRequested)="
        contactSection.showForm({
          subject: 'Termin für das kostenlose Website-Angebot',
          message:
            'Hallo Sonja,\n\nwir interessieren uns für eine der ersten drei kostenlosen Vereins-Websites und würden gerne einen Termin vereinbaren.\n\nViele Grüße',
        })
      "
    />
    <app-home-challenges (contactFormRequested)="contactSection.showForm($event)" />
    <app-services />
    <app-home-process />
    <app-home-about />
    <app-home-faq />
    <app-home-contact #contactSection />
  </main>
  <app-footer />
</div>
